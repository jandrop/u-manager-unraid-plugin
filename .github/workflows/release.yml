name: Release

# Fires on Unraid-style version tags: YYYY.MM.DD[.N], e.g. 2026.06.03.1.
on:
  push:
    tags:
      - '2[0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check the .plg matches the tag
        # Installs download these files from the tag and reject any whose
        # MD5 differs from the one declared in the .plg.
        run: |
          entity() { sed -n "s/^<!ENTITY $1 \"\(.*\)\">$/\1/p" UManager.plg; }
          fail=0
          check() {
            if [ "$1" != "$2" ]; then echo "::error::$3: .plg has '$1', expected '$2'"; fail=1; fi
          }
          check "$(entity version)" "${GITHUB_REF_NAME}" "version"
          check "$(entity xmlMD5)" "$(md5sum < plugins/dynamix/agents/UManager.xml | cut -d' ' -f1)" "xmlMD5"
          check "$(entity iconMD5)" "$(md5sum < plugins/dynamix/icons/umanager.png | cut -d' ' -f1)" "iconMD5"
          exit $fail

      - name: Publish GitHub release with the .plg asset
        # This plugin has no separate tarball — the .plg fetches each
        # FILE directly from raw.githubusercontent.com at install time.
        # We only need to ship the .plg itself as an asset so the
        # Releases API counts installs (the side feed in
        # u-manager-companion/store/feed.json points at
        # releases/latest/download/UManager.plg, which resolves to
        # this asset).
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: UManager.plg
          generate_release_notes: false
          fail_on_unmatched_files: true
